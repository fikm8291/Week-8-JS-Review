<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Digital Portfolio Hub</title>
  </head>
  <body>
    <header>
      <h1>My Digital Portfolio</h1>
    </header>

    <main>
      <section class="profile-card">
        <h2 id="profile-name">Your Name</h2>
        <p id="profile-role">Your Role</p>
        <p id="experience">Years of Experience</p>

        <div id="status-box">Current Status: Unknown</div>

        <button id="toggle-details-btn">Toggle Details</button>

        <div id="details-container">
          <p>Additional information about you goes here.</p>
          <p>Skills, interests, or projects.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>MAES Digital Skills</p>
    </footer>
  </body>
</html>
